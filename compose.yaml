name: fall-detection-web-app

services:
  server:
    image: fall-detection-web-server:dev
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    environment:
      CAMERA_API_TOKEN: ${CAMERA_API_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      MONITOR_USERNAME: ${MONITOR_USERNAME}
      MONITOR_PASSWORD_HASH: ${MONITOR_PASSWORD_HASH}
    ports:
      - "8000:8000"
    user: "1000:1000"
    volumes:
      - ./src/server/app:/app/app
      - ./data:/data
    init: true
    networks:
      - fall-monitor-network

  camera:
    image: fall-detection-web-camera:dev
    build:
      context: .
      dockerfile: Dockerfile.camera
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    environment:
      CAMERA_API_TOKEN: ${CAMERA_API_TOKEN}
      SHOW_WINDOW: ${SHOW_WINDOW:-true}
      DISPLAY: ${DISPLAY:-:0}
    depends_on:
      - server
    user: "1000:1000"
    group_add:
      - "44"
    volumes:
      - ./src/camera/app:/app/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - "${HOST_CAMERA_DEVICE:-/dev/video0}:/dev/video0"
    gpus: all
    command: ["python", "-m", "app.main"]
    init: true
    stdin_open: true
    tty: true
    networks:
      - fall-monitor-network

networks:
  fall-monitor-network:
    driver: bridge
